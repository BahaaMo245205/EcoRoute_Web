{% extends 'layout.html' %}

{% block title %} 403 | غير مسموح بالدخول {% endblock %}

{% block content %}
<style>
    .forbidden-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .lock-icon {
        font-size: 6rem;
        color: #dc3545; /* لون أحمر خطر */
        margin-bottom: 20px;
        animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
    }

    .error-code-403 {
        font-size: 8rem;
        font-weight: 900;
        color: #212529;
        line-height: 1;
    }

    .btn-back {
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: bold;
    }
</style>

<div class="container forbidden-container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="lock-icon">
                <i class="fas fa-user-shield"></i>
            </div>
            <h1 class="error-code-403">403</h1>
            <h2 class="fw-bold text-danger mb-3">دخول ممنوع!</h2>
            <p class="text-muted mb-5 fs-5">
                عذراً، معندكش الصلاحيات الكافية عشان تشوف الصفحة دي. 
                <br>
                لو شايف إن ده غلط، ارجع للدعم الفني.
            </p>
            <a href="{{ url_for('main.home') }}" class="btn btn-dark btn-back shadow">
                <i class="fas fa-arrow-right me-2"></i> ارجع لبر الأمان
            </a>
        </div>
    </div>
</div>
{% endblock %}
