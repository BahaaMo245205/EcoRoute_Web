{% extends 'layout.html' %}

{% block title %} 404 | الصفحة غير موجودة {% endblock %}

{% block content %}
<style>
    .error-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #fff;
    }

    .error-code {
        font-size: 10rem;
        font-weight: 900;
        background: linear-gradient(135deg, #0d6efd 0%, #00d2ff 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
    }

    .error-car-icon {
        font-size: 5rem;
        color: #0d6efd;
        position: relative;
        animation: drive 3s infinite linear;
    }

    @keyframes drive {
        0% { transform: translateX(-20px); opacity: 0; }
        50% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(20px); opacity: 0; }
    }

    .btn-home {
        padding: 12px 35px;
        border-radius: 50px;
        font-weight: bold;
        transition: 0.3s;
    }
</style>

<div class="container error-container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="error-car-icon mb-4">
                <i class="fas fa-car-side"></i>
            </div>
            <h1 class="error-code">404</h1>
            <h2 class="fw-bold mb-3">يا خبر! الطريق ده مسدود</h2>
            <p class="text-muted mb-5 fs-5">
                شكلنا خدنا ملف غلط.. الصفحة اللي بتدور عليها مش موجودة أو اتنقلت لمكان تاني.
            </p>
            <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg btn-home shadow">
                <i class="fas fa-home me-2"></i> ارجع للرئيسية ونبدأ من جديد
            </a>
        </div>
    </div>
</div>
{% endblock %}
