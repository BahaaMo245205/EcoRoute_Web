{% extends 'layout.html' %}

{% block title %} 500 | خطأ في الخادم {% endblock %}

{% block content %}
<style>
    .server-error-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .repair-icon {
        font-size: 6rem;
        color: #ffc107; /* لون تحذيري (أصفر) */
        margin-bottom: 20px;
    }

    .error-code-500 {
        font-size: 8rem;
        font-weight: 900;
        background: linear-gradient(135deg, #212529 0%, #495057 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
    }

    /* حركة بسيطة للمفك */
    .fa-tools {
        animation: wrench 2s infinite ease-in-out;
    }

    @keyframes wrench {
        0%, 100% { transform: rotate(-15deg); }
        50% { transform: rotate(15deg); }
    }
</style>

<div class="container server-error-container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="repair-icon">
                <i class="fas fa-tools"></i>
            </div>
            <h1 class="error-code-500">500</h1>
            <h2 class="fw-bold mb-3">عطل فني مفاجئ!</h2>
            <p class="text-muted mb-5 fs-5">
                شكل المحرك فيه مشكلة.. بنحاول نصلح العطل دلوقتي. 
                <br>
                جرب تعمل تحديث للصفحة (Refresh) بعد دقيقة.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg rounded-pill px-4 shadow">
                    <i class="fas fa-home me-2"></i> الرئيسية
                </a>
                <button onclick="location.reload()" class="btn btn-outline-secondary btn-lg rounded-pill px-4">
                    <i class="fas fa-sync-alt me-2"></i> تحديث
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
